<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore Lil Dino's Kitchen</title>
<style>
:root{--cream:#fff8e8;--green:#315c36;--pink:#f28ba8;--brown:#8a5a3b;--soft:#fff0f4;--deep:#a94c6a}
*{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--green);font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center}
.wrap{max-width:1200px;margin:auto;padding:18px 12px 34px}.title{font-weight:800;font-size:clamp(25px,4vw,44px);color:var(--pink);margin:4px 0 2px}.sub{margin:0 0 16px;font-size:clamp(15px,2vw,20px);color:var(--green)}
.map{position:relative;width:100%;overflow:hidden;border-radius:22px;box-shadow:0 8px 28px rgba(70,45,20,.18);background:#fff}.map img{display:block;width:100%;height:auto}
.hotspot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;z-index:2}.hotspot:focus-visible{outline:3px solid #fff;border-radius:18px;box-shadow:0 0 0 5px var(--pink)}
.panel{display:none;margin:18px auto 0;max-width:900px;background:var(--soft);border:3px solid #f7b0c3;border-radius:20px;padding:18px;text-align:left;box-shadow:0 5px 18px rgba(70,45,20,.1)}
.panel.show{display:block}.panel h2{margin:0 0 8px;color:var(--deep);font-size:clamp(22px,3vw,30px);padding-right:75px}.panel p{margin:0 0 12px;line-height:1.5}.close{float:right;border:0;background:var(--pink);color:white;font-weight:800;border-radius:999px;padding:8px 15px;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-top:12px}.choice{border:2px solid #f2b1c3;background:#fff;border-radius:14px;padding:10px;color:var(--green);font-weight:700;text-align:left;cursor:pointer}.choice:hover,.choice:focus{background:#ffe5ed}.detail{margin-top:14px;background:white;border-radius:15px;padding:14px;border-left:5px solid var(--pink)}.detail h3{margin:0 0 7px;color:var(--deep)}.detail ul{margin:7px 0 0 20px;padding:0;line-height:1.55}.tip{margin-top:10px;padding:10px 12px;background:#fff8d9;border-radius:12px}.back{margin-top:12px;border:0;background:#315c36;color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer}.note{margin-top:12px;font-size:13px;opacity:.75}
.searchBox{margin:14px 0 12px;padding:13px;background:#fff;border:2px solid #f7b0c3;border-radius:16px}.searchBox label{display:block;font-weight:800;color:var(--deep);margin-bottom:8px}.searchRow{display:flex;gap:8px}.searchRow input{flex:1;min-width:0;border:2px solid #e8b8c7;border-radius:12px;padding:10px 12px;font:inherit;color:var(--green);background:#fff}.searchRow button{border:0;border-radius:12px;padding:10px 15px;background:var(--pink);color:#fff;font-weight:800;font:inherit;cursor:pointer}.searchHint{font-size:12px;margin-top:7px;opacity:.72}.searchResult{margin-top:12px;background:#fff;border-radius:15px;padding:14px;border-left:5px solid #6FAF45}
.devNote{font-size:.92em;opacity:.82;margin-top:14px;padding-top:12px;border-top:1px solid #f0b8c8;}.searchResult h3{margin:0 0 7px;color:var(--deep)}.searchResult ul{margin:7px 0 0 20px;padding:0;line-height:1.55}
.pantry{left:13%;top:22%;width:20%;height:12%}.fridge{left:1%;top:45%;width:18%;height:13%}.herb{left:36%;top:23%;width:19%;height:13%}.dinner{left:53%;top:25%;width:23%;height:13%}.baking{right:10%;top:25%;width:20%;height:13%}.cafe{right:0%;top:43%;width:18%;height:16%}.prep{left:39%;top:53%;width:21%;height:15%}.secret{right:1%;top:62%;width:20%;height:15%}.trash{right:0%;bottom:1%;width:21%;height:15%}.hq{left:4%;bottom:1%;width:25%;height:25%}
@media (max-width:600px){.wrap{padding:10px 7px 24px}.map{border-radius:14px}.panel{padding:14px;border-radius:15px}.note{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">🗺️ Explore Lil Dino's Kitchen</h1>
  <p class="sub">Where should we explore today?<br>Pick a destination and start your adventure! ✨</p>
  <div class="map" aria-label="Interactive map of Lil Dino's kitchen">
    <img src="kitchen-map.png" alt="Little Dino's Kitchen Adventures map with Lil Dino on a pink step stool and his hamster-dragon pet beside him">
    <button class="hotspot pantry" aria-label="Open Pantry" data-room="pantry"></button>
    <button class="hotspot fridge" aria-label="Open Fridge" data-room="fridge"></button>
    <button class="hotspot herb" aria-label="Open Herb Garden" data-room="herb"></button>
    <button class="hotspot dinner" aria-label="Open Dinner Station" data-room="dinner"></button>
    <button class="hotspot baking" aria-label="Open Baking Corner" data-room="baking"></button>

<script>
const rooms={
fridge:{title:'🥛 The Fridge — Food Freshness Guide',desc:'Pick a food and Lil Dino will show you simple ways to store it, keep it fresh, and know when to use it first.',items:{
'🍓 Strawberries':['Keep them dry and refrigerated. Don’t wash the whole batch until you are ready to eat them.','Remove any berries that are moldy or leaking so they don’t spoil the others.','For cut strawberries, use a clean covered container and refrigerate them.'],
'🐉 Dragon Fruit':['Keep a whole dragon fruit in the refrigerator when you want to slow ripening and keep it fresh longer.','Keep it dry and uncut until you are ready to use it.','Once cut, put the pieces in a clean airtight container and refrigerate.'],
'🍌 Bananas':['Keep uncut bananas at room temperature until ripe.','Once they are as ripe as you like, you can refrigerate them to slow further ripening; the peel may darken.','Keep cut banana pieces covered and refrigerated.'],
'🍎 Apples':['Store apples in the refrigerator to help them stay crisp longer.','Keep them away from foods that can be affected by the natural gases apples give off.','Check for soft or spoiled spots and remove damaged pieces.'],
'🥬 Lettuce':['Refrigerate lettuce and keep it as dry as possible.','A clean container or bag with a paper towel can help absorb extra moisture.','Remove wilted or slimy leaves before the rest is affected.'],
'🫐 Berries':['Refrigerate berries and keep them dry until you are ready to eat them.','Wash gently just before eating rather than washing the whole container ahead of time.','Remove moldy berries right away.'],
'🥛 Milk':['Keep milk refrigerated and return it to the fridge promptly after pouring.','Keep the carton closed and store it toward the back of the refrigerator rather than in the warmest door area.','When in doubt about safety, follow the package date/storage guidance and throw it out if it has been mishandled.'],
'🥚 Eggs':['Keep eggs refrigerated in their original carton.','Avoid leaving eggs sitting out for long periods.','For hard-cooked eggs, refrigerate them in a covered container.'],
'🥩 Meat & Chicken':['Keep raw meat and chicken refrigerated and sealed so juices cannot drip onto other foods.','Use a separate cutting board or wash and sanitize surfaces after raw meat.','If you are not using it soon, freeze it in a well-sealed package.'],
'🍞 Bread':['Keep bread sealed at room temperature if you will use it soon.','For longer storage, freezing helps prevent staleness.','If you see mold on soft bread, discard the loaf rather than cutting around the mold.'] }},
pantry:{title:'🍓 The Pantry — Pantry Master',desc:'Pick a pantry item to learn how to store it, organize it, and know when to use it first.',items:{'🌾 Flour':['Keep flour tightly sealed in a cool, dry place.','For longer storage, especially whole-grain flour, refrigeration or freezing can help preserve quality.'],'🍚 Rice':['Store dry rice in a cool, dry place in a sealed container.','Keep moisture and pantry pests out.'],'🍝 Pasta':['Keep dry pasta sealed in a cool, dry pantry.','Label opened packages if you move them into containers.'],'🥫 Canned Foods':['Store unopened cans in a cool, dry place.','Use cans that are not swollen, leaking, badly rusted, or badly damaged.'],'🧈 Butter':['Refrigerate butter unless your package specifically says otherwise.','For longer storage, freeze well-wrapped butter.'],'🍫 Chocolate Chips':['Keep them tightly sealed in a cool, dry place away from strong odors.','Avoid heat that can cause melting or bloom.']}},
herb:{title:'🌿 The Herb Garden — Herb & Seasoning Guide',desc:'Pick a food and get a simple flavor plan.',items:{'🍗 Chicken':['Try garlic + rosemary + thyme.','For a brighter flavor, add lemon and parsley.'],'🍝 Pasta':['Try basil + oregano + garlic.','Finish with Parmesan, black pepper, or a little chili flake.'],'🥦 Vegetables':['Try garlic + parsley + lemon.','For roasted vegetables, rosemary or thyme works well.'],'🍲 Soup':['Try thyme + parsley for cozy soups.','Taste first, then add salt a little at a time.'],'🥔 Potatoes':['Try rosemary + garlic + black pepper.','Paprika adds a warm savory note.'],'🥚 Eggs':['Try chives + black pepper.','Dill or parsley also works beautifully.']}},
dinner:{title:'🍝 The Dinner Station — Dinner Generator',desc:'Pick your mood and Lil Dino gives you a dinner idea.',items:{'⚡ Quick & Easy':['Try garlic-butter pasta with a side of fruit.'],'🍲 Cozy & Comforting':['Try spaghetti with marinara and garlic bread.'],'🥗 Fresh & Light':['Try a chicken-and-vegetable bowl with lemon.'],'🌶️ Something Flavorful':['Try taco bowls with seasoned meat or beans, rice, salsa, and avocado.'],'🍝 Pasta Night':['Try spaghetti, creamy garlic pasta, or veggie pasta.'],'🌮 Taco/Mexican Night':['Try tacos, quesadillas, or a taco rice bowl.'],'🥘 One-Pan Dinner':['Try chicken and vegetables roasted together on one sheet pan.'],'🎲 Surprise Me!':['Lil Dino says: make a bowl with one protein, one grain, two vegetables, and your favorite sauce!']}},
baking:{title:'🍪 The Baking Corner — Baking Lab',desc:'Choose a baking topic and get practical guidance, troubleshooting, or substitutions.',items:{'🧁 Baking Basics':['Measure flour carefully instead of packing it into the cup.','Preheat the oven before baking.'],'🔄 Ingredient Swaps':['No butter? Some recipes can use margarine, but the texture may change.','Check the recipe before swapping eggs or leaveners because those changes can affect structure.'],'🛠️ Troubleshooting':['Cookies spreading too much? Chill the dough and check that the butter was not overly melted.','Pancakes too dense? Avoid overmixing the batter.'],'🍓 Flavor Combos':['Try strawberry + vanilla, chocolate + peanut butter, or lemon + blueberry.'],'🎯 Baking Challenge':['Try making a simple batch of cookies and add one safe flavor twist.'],'❓ What Happens If…?':['Tap a baking question and Lil Dino will explain the likely result and how to fix it.']}},
cafe:{title:'☕ The Cozy Café — Café Corner',desc:'Pick a café mood for a drink and snack idea.',items:{'☀️ Fresh & Fruity':['Strawberry refresher + a fruit cup.'],'🍫 Sweet & Cozy':['Hot chocolate + chocolate chip cookies.'],'☕ Coffeehouse':['Warm milk or a caffeine-free café-style drink + toast or a muffin.'],'🧊 Cool & Refreshing':['Strawberry refresher over ice + fresh fruit.'],'🥐 Breakfast Café':['Toast or a muffin + fruit.'],'🎲 Surprise Me!':['Lil Dino’s café pick: a strawberry drink and a warm baked treat.']}},
prep:{title:'🧊 The Prep Counter — Kitchen Skills Lab',desc:'Choose a kitchen skill and get a practical, step-by-step guide.',items:{'🔪 Chop & Cut':['Use a stable cutting board and keep fingertips curled away from the blade.','Ask an adult for help with knives when needed.'],'🥄 Measure It':['Use dry measuring cups for dry ingredients and liquid measuring cups for liquids.','Level dry ingredients for more consistent baking.'],'🥣 Mix & Prep':['Read the recipe first, gather ingredients, then mix in the order listed.'],'🔥 Cooking Basics':['Use oven mitts for hot pans and turn pot handles inward.','Never leave cooking food unattended when heat is on.'],'🧼 Kitchen Safety':['Wash hands before cooking and after handling raw meat.','Clean surfaces and utensils after preparing raw foods.'],'🎯 Skill Challenge':['Practice measuring flour, washing fruit, and setting up your ingredients before cooking.']}},
secret:{title:'✨ The Secret Recipe Room — Mystery Quest',desc:'Pick a mystery and Lil Dino reveals a mini food adventure.',items:{'🎲 Mystery Recipe':['Make a strawberry refresher and serve it with a small fruit snack.'],'🔐 Hidden Recipes':['Secret combo: chocolate chips + banana can become a fun topping for toast or pancakes.'],'🌎 Secret Around-the-World Recipe':['Try a simple taco rice bowl or a pasta dish with a new herb.'],'🎃 Seasonal Secrets':['Pick one seasonal fruit and build a snack around it.'],'🧩 Recipe Challenge':['Choose three ingredients you already have and invent a snack using them.'],'🎁 Mystery Box':['Pick one ingredient, one fruit or vegetable, and one pantry staple. Lil Dino says: create something!']}},
trash:{title:'🗑️ The Kitchen Trash Can — Before You Toss It!',desc:'Pick a food scrap and see whether it can be eaten, used in a recipe, regrown, composted, or safely tossed.',items:{
'🍊 Citrus Peels':['Wash the fruit first. Use zest in baking, marinades, dressings, or infused sugar/vinegar.','Recipe ideas: lemon-peel sugar, candied citrus peel, citrus-infused vinegar, or zest in muffins and cakes.','Compost the peel if your local setup accepts citrus.'],
'🥔 Potato Peels':['Wash potatoes well. Clean peels can be roasted with oil and seasoning until crisp.','Recipe ideas: crispy potato-peel chips, potato-peel soup/stock, or roasted peel toppings.','Do not use green, heavily sprouted, moldy, or spoiled potato parts.'],
'🥚 Eggshells':['Eggshells are not a snack. Rinse away egg residue and let them dry before crushing.','Crushed shells can be composted where accepted; some gardeners also use finely crushed shells in garden soil, but they are not a quick fertilizer.','Wash hands after handling raw egg residue.'],
'🥦 Broccoli Stems':['Peel the tough outer layer and slice the tender center.','Recipe ideas: stir-fries, soups, slaws, roasted vegetable trays, or finely chopped broccoli-stem fritters.','Compost the woody ends if your local system accepts them.'],
'🌿 Herb Stems':['Tender parsley, cilantro, dill, or basil stems can often be chopped into recipes.','Recipe ideas: herb pesto, chimichurri-style sauces, dressings, soups, stocks, and herb butter.','Woody stems can flavor stock and be strained out.'],
'🍎 Apple Peels':['Wash apples before using the peel.','Recipe ideas: apple-peel tea, baked apple-peel crisps, oatmeal toppings, muffins, or infused water.','Compost peels that are not being used.'],
'🍌 Banana Peels':['Banana peel is not something to casually eat raw. Use it only in a recipe designed for it, and wash the banana first.','Recipe ideas: banana-peel curry, banana-peel chutney, banana-peel stir-fry, or a banana-peel “pulled” filling made from cooked shredded peel.','If you do not want to cook with it, compost it where accepted.'],
'🍓 Strawberry Tops':['Wash strawberries first. The leafy tops can be blended into smoothies, used in infused water, or simmered into a fruit syrup.','Recipe ideas: strawberry-top infused water, strawberry-top syrup, or blended strawberry-top smoothies.','Compost them if you are not using them.'],
'🍍 Pineapple Scraps':['The peel and core are usually too tough to eat raw.','Recipe ideas: simmer clean peel/core for a pineapple-infused water or tea, or use them in a recipe that specifically calls for pineapple scraps.','Strain out tough pieces and compost what remains if accepted.'],
'🥕 Carrot Peels':['Wash carrots well. The peels can go into soups, stocks, or roasted vegetable mixes.','Recipe ideas: crispy roasted carrot peels, carrot-peel pesto, vegetable stock, or a roasted peel topping.','Compost clean peels when you are done.'],
'🧅 Onion Skins':['Onion skins are usually too tough to eat directly.','Recipe idea: add clean skins to stock for color and flavor, then strain them out before serving.','Compost the strained skins if accepted.'],
'🧄 Garlic Skins':['Garlic skins are usually too papery to eat, but they can add flavor to stock.','Recipe idea: simmer clean skins in vegetable or chicken stock, then strain them out.','Compost afterward if accepted.'],
'🍄 Shiitake Stems':['Shiitake stems are edible but often tough.','Recipe ideas: mushroom stock, broth, sauces, finely chopped dumpling fillings, or minced stir-fry mixtures.','Trim any hard woody end first.'],
'🍄 Oyster Mushroom Stems':['Trim the tough base; much of the remaining stem can be cooked.','Recipe ideas: stir-fries, soups, sauces, or chopped mushroom fillings.'],
'🍄 Enoki Bases':['Trim the compact root/base before cooking. The individual mushrooms are usable; the trimmed base is usually discarded or composted if accepted.'],
'🍄 Button Mushroom Stems':['Button mushroom stems are generally edible.','Recipe ideas: omelets, soups, sauces, sautés, or chopped mushroom fillings.'],
'🫚 Ginger Peel':['Wash ginger well. The peel can flavor tea, broth, stock, or infused water.','Recipe ideas: ginger-peel tea, ginger broth, or an aromatic stock.','🌱 Yes! Ginger can sometimes regrow from a healthy piece with a bud. Visit Dino Grow & Learn for instructions.'],
'🌱 Green Onion Ends':['Clean green onion ends can be added to stock, sauces, soups, or stir-fries.','🌱 Yes! Green onions are one of the easiest scraps to regrow. Visit Dino Grow & Learn for instructions.'],
'🌱 Scallion Ends':['Clean scallion ends can be used in stock, sauces, soups, or stir-fries.','🌱 Yes! Scallions can regrow from their rooted ends. Visit Dino Grow & Learn for instructions.'],
'🌱 Lemongrass':['Outer layers and woody stalk ends can flavor curry, broth, stock, or tea; strain out tough pieces.','🌱 Yes! Lemongrass can regrow from a fresh stalk base. Visit Dino Grow & Learn for instructions.'],
'🍃 Makrut Lime Leaves & Stems':['The leaves are useful in cooking; tough stems can be removed.','Recipe ideas: curry pastes, soups, stir-fries, or finely sliced leaf ribbons. Compost tough stems if accepted.'],
'🌶️ Chili Stems':['Chili stems are usually removed before cooking.','Compost or toss them if they are not being used for flavoring a stock.'],
'🥬 Napa Cabbage Outer Leaves':['Fresh outer leaves are edible after washing.','Recipe ideas: stir-fries, soups, wraps, kimchi-style preparations, or cabbage slaw.','Remove leaves that are slimy, moldy, or spoiled.'],
'🥬 Daikon Tops':['Fresh daikon greens are edible after washing.','Recipe ideas: sautéed greens, soups, stir-fries, pesto-style sauces, or mixed greens.','🌱 Some daikon can regrow from suitable tops. Visit Dino Grow & Learn for instructions.'],
'🥬 Radish Tops':['Fresh radish greens are edible after washing.','Recipe ideas: sautéed greens, pesto, soups, or grain bowls.','🌱 Some radishes can regrow from suitable tops. Visit Dino Grow & Learn for instructions.'],
'🍠 Taro Peels':['Do not eat taro peel raw. Taro itself must be thoroughly cooked.','The peel is better composted or tossed.'],
'🎃 Kabocha Rind':['Kabocha rind is commonly edible when cooked. Wash it well and cook it thoroughly.','Recipe ideas: roasted kabocha wedges, soups, curries, or stews where the rind softens during cooking.'],
'🎃 Kabocha Seeds':['Clean kabocha seeds can be roasted and eaten.','Recipe idea: roast the seeds with oil and seasoning for a crunchy snack or soup topping.'],
'🌽 Corn Husks':['Clean corn husks can be used as food wrappers or for steaming.','Recipe ideas: steamed tamales or other wrapped foods where a corn husk is part of the cooking method.','Compost used husks where accepted.'],
'🍙 Nori Scraps':['Good nori scraps can be crumbled into rice, soups, noodles, salads, or seasoning mixes.','Toss nori if it is stale, wet, moldy, or spoiled.'],
'🫛 Edamame Pods':['Edamame pods are usually not eaten.','Compost them where accepted, or discard them according to your local waste rules.'],
'🍃 Banana Leaves':['Clean banana leaves can be used as food wrappers or liners, but they are not eaten.','Recipe uses include steaming, grilling, or serving food on the leaf.','Compost them where accepted.'],
'🥥 Coconut Shell & Fiber':['Coconut shell and coarse fiber are not edible.','Reuse or compost them only where your local system accepts them; many municipal compost programs do not take hard shells.'],
'🍵 Tea Leaves':['Loose tea leaves can usually be composted.','Used leaves can also be mixed into some baked goods or rice dishes if the tea is a food-safe culinary variety and the texture works.'],
'🍵 Tea Bags':['Compost a tea bag only if it is plastic-free and accepted by your local compost system; many conventional bags contain plastic.','If unsure, remove the tea leaves and discard the bag according to local waste rules.'],
'🥢 Bamboo Skewers':['Bamboo skewers are objects, not food scraps. Reuse them if appropriate or follow your local trash/compost rules.'],
'🥢 Chopsticks':['Chopsticks are objects, not food scraps. Reuse them if appropriate or follow your local trash/compost rules.'],
'⚠️ Safety First':['If a scrap is moldy, spoiled, contaminated, or you are unsure about its safety, throw it away. Do not taste questionable food just to find out.']}},grow:{title:'🌱 Dino Grow & Learn',desc:'Some kitchen scraps can grow again. Pick one to learn what to save, how to start it, and what to expect.',items:{
'🧅 Green Onions':['Save the white rooted base with a little green attached.','Stand the roots in a shallow cup of water in a bright spot. Change the water every few days.','Once new green growth appears, move it to soil if you want longer-term growth.'],
'🥬 Lettuce':['Save the bottom core after removing the leaves.','Set the core in a shallow dish with a little water and place it in bright light.','New leaves may regrow, but the plant may not produce a full new head like the original.'],
'🥬 Bok Choy':['Save the bottom base with the root end intact.','Place it in a shallow dish with a little water and bright light.','After new growth appears, transplant it to soil for a longer growing attempt.'],
'🌿 Herbs':['Some fresh herb cuttings can root in water, especially soft-stem herbs such as basil or mint.','Place a clean cutting in water with the lower leaves removed and change the water regularly.','Once roots develop, plant it in potting soil and keep the soil appropriately moist.'],
'🧄 Garlic':['Plant a healthy garlic clove with the pointed end up in loose soil.','Keep the soil lightly moist and give it plenty of sunlight.','Garlic greens can be harvested earlier; a full bulb takes much longer and depends on the variety and growing conditions.'],
'🫚 Ginger':['Save a fresh piece with visible buds or “eyes.”','Plant it shallowly in moist, well-draining soil with the buds facing up.','Keep it warm and lightly moist. Ginger takes time, so this is a patience quest.'],
'🌱 Lemongrass':['Save a fresh stalk base that still has the thicker root end.','Place the base in a little water in a bright spot and change the water regularly.','When roots develop, plant it in soil and keep it warm and watered.'],
'🥕 Carrot Tops':['Save the leafy top rather than the long root.','Place the top in a shallow dish of water. It can regrow greens, but it will not grow a new carrot root from the top.','Use the greens as a garnish or in cooking when fresh.'],
'🍠 Sweet Potato':['A sweet potato can produce slips—new shoots that can become plants.','Place a healthy sweet potato partly in water or soil in a warm, bright spot and wait for shoots.','Once slips develop roots, they can be planted in soil.'],
'🍍 Pineapple':['A pineapple crown can sometimes root and grow into a new pineapple plant.','Remove excess fruit from the crown base, let the cut area dry, then root it in water or plant it in well-draining soil.','Pineapples take a long time to mature, especially indoors.'],
'🥑 Avocado':['A healthy avocado pit can sometimes sprout, but growing a fruit-producing tree from a pit takes years and may not reproduce the parent fruit exactly.','Clean the pit, start it in water or moist soil, and give it warmth and bright light.','Think of this one as a fun growing experiment more than a quick food supply.']}},
hq:{title:'🦖 Lil Dino’s Kitchen HQ',desc:'Home base for Little Dino’s Kitchen Adventures!',items:{'💗 Cook':['Choose a recipe and start cooking.'],'🗺️ Explore':['Tap another kitchen destination.'],'✨ Discover':['Try a guide you have not explored yet.'],'🐹 Meet the Adventure Buddy':['Lil Dino’s tiny hamster-dragon buddy is ready for the next quest!']}}
};
const panel=document.getElementById('panel'),title=document.getElementById('roomTitle'),desc=document.getElementById('roomDesc'),choices=document.getElementById('choices'),detail=document.getElementById('detail');
const roomSearch=document.getElementById('roomSearch'),searchBtn=document.getElementById('searchBtn'),searchHint=document.getElementById('searchHint');

const searchData={
fridge:{
  hints:'Search a food—even if it is not one of the examples below.',
  examples:{

    strawberries:['Keep strawberries dry and refrigerated. Do not wash the whole batch until you are ready to eat them. Remove moldy or leaking berries.'],
    blueberries:['Refrigerate blueberries and keep them dry until ready to eat. Wash gently just before eating.'],
    raspberries:['Refrigerate raspberries and keep them dry. Remove spoiled berries promptly so they do not affect the rest.'],
    grapes:['Refrigerate grapes in a breathable container or their original package. Wash them just before eating for best quality.'],
    peaches:['Keep unripe peaches at room temperature until they soften, then refrigerate to slow further ripening.'],
    nectarines:['Let firm nectarines ripen at room temperature, then refrigerate once ripe.'],
    avocado:['Let a whole avocado ripen at room temperature. Once ripe, refrigerate it to slow further ripening. Cover cut avocado and refrigerate.'],
    tomatoes:['Keep ripe tomatoes at room temperature for best flavor. Refrigerate only if you need to slow very ripe tomatoes briefly.'],

function measurementAnswer(q){
  const s=q.toLowerCase().replace(/,/g,'').replace(/\s+/g,' ').trim();
  const unitToTsp={tsp:1,teaspoon:1,teaspoons:1,tbsp:3,tablespoon:3,tablespoons:3,cup:48,cups:48};
  const unitLabel={tsp:'teaspoon(s)',tbsp:'tablespoon(s)',cup:'cup(s)'};
  const frac={'½':.5,'1/2':.5,'⅓':1/3,'1/3':1/3,'⅔':2/3,'2/3':2/3,'¼':.25,'1/4':.25,'¾':.75,'3/4':.75,'⅛':.125,'1/8':.125,'⅜':.375,'3/8':.375,'⅝':.625,'5/8':.625,'⅞':.875,'7/8':.875};
  const words={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,half:.5,quarter:.25};
  const unitRegex='(teaspoons?|tsp|tablespoons?|tbsp|cups?)';
  const getUnit=u=>{u=u.toLowerCase();if(/^teaspoon|^tsp/.test(u))return'tsp';if(/^tablespoon|^tbsp/.test(u))return'tbsp';if(/^cup/.test(u))return'cup';return null};
  const getNumber=t=>{
    if(!t)return null;
    let m=t.match(/(\d+(?:\.\d+)?|½|⅓|⅔|¼|¾|⅛|⅜|⅝|⅞|\d+\/\d+)/);
    if(m){let raw=m[1];if(frac[raw]!=null)return frac[raw];if(raw.includes('/')){const [a,b]=raw.split('/').map(Number);return b?a/b:null}return Number(raw)}
    for(const [w,v] of Object.entries(words))if(new RegExp('\\b'+w+'\\b').test(t))return v;
    return null;
  };
  const format=(n)=>Math.abs(n-Math.round(n))<1e-9?String(Math.round(n)):n.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');

  // Common baking-weight question. A cup is not a universal weight, so only answer when the ingredient is known.
  const flour=/\b(flour|all[- ]purpose flour)\b/.test(s);
  const weightMatch=s.match(/how many ounces.*(?:in|is)\s+(?:a|an|one|1)\s+cup(?:s)?(?:\s+of\s+)?(?:all[- ]purpose\s+)?flour/);
  if(weightMatch || (/\bounces\b/.test(s)&&/\b(one|1)\s+cup\b/.test(s)&&flour)){
    return 'One US cup of all-purpose flour is about <strong>4.25 ounces (120 grams)</strong> by weight. For baking, a kitchen scale is the most accurate option.';
  }

  // Natural question: "How many tablespoons are in one cup?"
  let m=s.match(new RegExp('how many\\s+'+unitRegex+'\\s+(?:are\\s+)?in\\s+(?:a|an|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|\\d+(?:\\.\\d+)?|½|⅓|⅔|¼|¾|⅛|⅜|⅝|⅞|\\d+\\/\\d+)\\s+'+unitRegex));
  if(m){
    const target=getUnit(m[1]), source=getUnit(m[2]);
    const phrase=m[0];
    const numText=phrase.match(/(?:in\s+)(a|an|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|\d+(?:\.\d+)?|½|⅓|⅔|¼|¾|⅛|⅜|⅝|⅞|\d+\/\d+)\s+/);
    const n=getNumber(numText&&numText[1]);
    if(target&&source&&n!=null&&target!==source){
      const result=n*unitToTsp[source]/unitToTsp[target];
      return `There are <strong>${format(result)} ${unitLabel[target]}</strong> in ${format(n)} ${unitLabel[source]}.`;
    }
  }

  // Conversion wording: "How many tablespoons is 1 cup?", "How many cups is 16 tbsp?", "10 tsp in tbsp"
  const pair=[...s.matchAll(new RegExp('\\b'+unitRegex+'\\b','g'))];
  if(pair.length>=2){
    const first=getUnit(pair[0][1]), second=getUnit(pair[1][1]);
    let n=getNumber(s.slice(0,pair[0].index));
    if(n==null)n=getNumber(s.slice(pair[0].index+pair[0][0].length,pair[1].index));
    if(n==null)n=getNumber(s.slice(pair[1].index+pair[1][0].length));
    if(first&&second&&n!=null&&first!==second){
      const result=n*unitToTsp[first]/unitToTsp[second];
      return `There are <strong>${format(result)} ${unitLabel[second]}</strong> in ${format(n)} ${unitLabel[first]}.`;
    }
  }
  return null;
}

  const r=rooms[currentRoom];
  const tips=r.items[k];
  currentSkill=k;
  roomSearch.value='';
  roomSearch.placeholder=`Search ${k.replace(/^[^\w]+/,'')}...`;
  searchHint.textContent=`Search specifically within “${k.replace(/^[^\w]+/,'')}”.`;
  detail.innerHTML=`<div class="detail"><h3>${k}</h3><ul>${tips.map(x=>`<li>${x}</li>`).join('')}</ul>${currentRoom==='fridge'?'<div class="tip">🦖 Food-safety note: Keep perishable foods cold, prevent cross-contamination, and follow the package or food-safety guidance for the specific food.</div>':''}<button class="back" onclick="backToChoices()">↩ Back to choices</button></div>`;
  detail.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function backToChoices(){
  currentSkill=null;
  roomSearch.value='';
  roomSearch.placeholder='Search this room...';
  searchHint.textContent=(searchData[currentRoom]&&searchData[currentRoom].hints)||'Search this room for more ideas.';
  detail.innerHTML='';
}

function getCleaningKey(q){
  const aliases = [
    ['dishwashing liquid','dishwashing liquid'],
    ['dish soap','dish soap'],
    ['baking soda','baking soda'],
    ['cream of tartar','cream of tartar'],
    ['white vinegar','vinegar'],
    ['vinegar','vinegar'],
    ['grapefruit','grapefruit'],
    ['orange','orange'],
    ['lemon','lemon'],
    ['lime','lime'],
    ['salt','salt']
  ];
  for(const [needle,key] of aliases){
    if(q.includes(needle)) return key;
  }
  return null;
}

function cleaningSection(q){
  const key=getCleaningKey(q);
  if(!key) return '';
  const item=cleaningGuide[key];
  return `<p><strong>🧽 Cleaning use — ${item.title}:</strong> ${item.tip}</p><p>${item.safety}</p><p class="smallNote">Lil Dino's rule: useful for cleaning does not automatically mean safe for every surface or strong enough to disinfect.</p>`;
}

function searchRoom(){
  const q=normalize(roomSearch.value);
  if(!q){
    detail.innerHTML='<div class="searchResult"><h3>🔎 What should we explore?</h3><p>Type a specific food, task, ingredient, measurement, or question.</p></div>';
    return;
  }

  // Cleaning help is now included automatically in normal ingredient searches.
  // People do not need to know a special cleaning question.
  const cleaning = cleaningSection(q);

  // Lil Dino reserves the sass for searches that are clearly unrelated to food or kitchens.
  if(isObviousNonsense(q)){
    detail.innerHTML=`<div class="searchResult"><h3>🦖😂 Kitchen Search Rejected</h3><p>${sarcasticSearch(q)}</p><p class="devNote">🛠️ This website is still being developed, so Lil Dino may not recognize everything you ask about yet. We’re adding more food and kitchen guides all the time!</p></div>`;
    detail.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }

  // Measure It gets a real conversion answer instead of a generic kitchen guide.
  if(currentRoom==='prep' && currentSkill && normalize(currentSkill.replace(/^[^\w]+/,''))==='measure it'){
    const measurement=measurementAnswer(q);
    if(measurement){
      detail.innerHTML=`<div class="searchResult"><h3>🥄 Measurement Answer</h3><p>${measurement}</p><p class="smallNote">Kitchen conversion note: teaspoons, tablespoons, and cups are volume measurements. Ingredient weights can differ, so a cup of flour does not weigh the same as a cup of sugar.</p></div>`;
      detail.scrollIntoView({behavior:'smooth',block:'nearest'});
      return;
    }
  }

  const r=searchData[currentRoom]||{};
  const entries=r.examples||{};
  let found=null;

  // When a category is selected, first look for an exact match for that category's topic.
  for(const [key,val] of Object.entries(entries)){
    const k=normalize(key);
    if(q===k || k.includes(q) || q.includes(k)){found={key,val};break;}
  }

  if(found){
    detail.innerHTML=formatSearchResult(found.key,found.val,cleaning);
  }else{
    const isFallback = !r.fallback;
    detail.innerHTML=`<div class="searchResult"><h3>🦖 Lil Dino's guide for ${q}</h3><p>${isFallback?'I don’t have a specific entry for that yet. Try a more specific food, task, ingredient, or question.':r.fallback(q)}</p>${cleaning}${isFallback?'<p class="devNote">🛠️ This website is still being developed, so Lil Dino may not recognize everything you ask about yet. We’re adding more food and kitchen guides all the time!</p>':''}</div>`;
  }
  detail.scrollIntoView({behavior:'smooth',block:'nearest'});
}
